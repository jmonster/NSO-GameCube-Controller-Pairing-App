name: Verify isolated USB migration repair
on:
  push:
    branches: [work/verify-usb-slot-migration]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'jmonster/NSO-GameCube-Controller-Pairing-App'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply only the reviewed repair to the existing PR head
        shell: bash
        run: |
          set -euo pipefail
          cp tests/test_usb_migration.py /tmp/test_usb_migration.py
          git checkout --detach 4051b8010e0245d905554e02192bcd7feef3ad64
          cp /tmp/test_usb_migration.py tests/test_usb_migration.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/gc_controller/connection_manager.py')
          s = p.read_text(encoding='utf-8')
          old = '    def send_rumble(self, state: bool) -> bool:\n'
          new = '''    def transfer_to(self, destination) -> bool:
                  """Move a stopped reader's HID handle and feedback binding together."""
                  if destination is self:
                      return False
                  first, second = sorted((self, destination), key=id)
                  with first._session_lock, second._session_lock:
                      if self.device is None or destination.device is not None:
                          return False
                      destination.device, self.device = self.device, None
                      destination.device_path, self.device_path = self.device_path, None
                      destination._usb_device, self._usb_device = self._usb_device, None
                      return True
          
          '''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new + old), encoding='utf-8')
          p = Path('src/gc_controller/app.py'); s = p.read_text(encoding='utf-8')
          old = "        saved_path = usb_slot_obj.device_path\n        saved_hid = usb_slot_obj.conn_mgr.device\n\n        # Detach without closing the HID handle\n        usb_slot_obj.conn_mgr.device = None\n"
          new = "        saved_path = usb_slot_obj.device_path\n        target_slot = self.slots[ble_slot]\n        if not usb_slot_obj.conn_mgr.transfer_to(target_slot.conn_mgr):\n            usb_slot_obj.input_proc.start()\n            if was_emulating:\n                self.toggle_emulation(usb_slot)\n            return\n\n        # The complete HID/feedback session now belongs to the target slot.\n"
          assert s.count(old) == 1; s = s.replace(old, new)
          old = "        target_slot = self.slots[ble_slot]\n        target_sui = self.ui.slots[ble_slot]\n\n        target_slot.conn_mgr.device = saved_hid\n"
          new = "        target_sui = self.ui.slots[ble_slot]\n\n"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python -m unittest discover -s tests -q
          python -m compileall -q src
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gc_controller/app.py src/gc_controller/connection_manager.py tests/test_usb_migration.py
          git commit -m 'fix(usb): retain feedback identity when migrating controller slots'
          test "$(git ls-remote origin refs/heads/stabilize/controller-sessions-and-macos | cut -f1)" = 4051b8010e0245d905554e02192bcd7feef3ad64
          git push origin HEAD:refs/heads/stabilize/controller-sessions-and-macos
