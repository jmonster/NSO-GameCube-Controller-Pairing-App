name: Dependency lock candidates
on:
  push:
    branches: [stabilize/controller-sessions-and-macos]
    paths: ['tools/dependency_lock.py', 'pyproject.toml', '.github/workflows/lock-candidates.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Resolve candidate locks, never publish automatically
        run: python tools/dependency_lock.py generate --locks candidate-locks
      - name: Verify hashed install in a clean environment
        run: python tools/dependency_lock.py install --locks candidate-locks --venv .lock-check-env
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lock-candidate-${{ matrix.os }}
          path: candidate-locks/
          retention-days: 7
