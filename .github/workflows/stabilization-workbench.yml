name: Temporary stabilization workbench

# Branch-scoped import bridge. Remove before merge.
on:
  push:
    branches: [stabilize/controller-sessions-and-macos]
    paths:
      - '.github/workflows/stabilization-workbench.yml'
      - '_stabilization/**'

permissions:
  contents: write

concurrency:
  group: stabilization-workbench
  cancel-in-progress: false

jobs:
  validate-and-import:
    if: github.repository == 'jmonster/NSO-GameCube-Controller-Pairing-App'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Apply reviewed mail patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          shopt -s nullglob
          patches=(_stabilization/*.patch)
          if (( ${#patches[@]} )); then
            git am --exclude='.github/workflows/*' "${patches[@]}"
            git rm -- "${patches[@]}"
            git commit -m 'chore: remove applied stabilization import files'
          fi
          if [ -f _stabilization/batch.sha256 ]; then
            python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          parts = sorted(Path('_stabilization').glob('batch.b64.*'))
          assert parts, 'Missing patch payload'
          payload = lzma.decompress(base64.b64decode(b''.join(p.read_bytes() for p in parts), validate=True))
          expected = Path('_stabilization/batch.sha256').read_text().strip()
          assert hashlib.sha256(payload).hexdigest() == expected, 'Patch checksum mismatch'
          Path('/tmp/stabilization.patch').write_bytes(payload)
          PY
            # Workflow files are published separately through the GitHub connector.
            # The Actions token has contents permission, not workflows permission.
            git am --exclude='.github/workflows/*' /tmp/stabilization.patch
            git rm -- _stabilization/batch.b64.* _stabilization/batch.sha256
            git commit -m 'chore: remove applied stabilization import files'
          fi
      - name: Validate production sources and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src
          if [ -d tests ]; then python -m unittest discover -s tests -v; fi
          git diff --check
      - name: Publish validated commits without force
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            remote=$(git ls-remote origin refs/heads/stabilize/controller-sessions-and-macos | cut -f1)
            test "$remote" = "$GITHUB_SHA"
            git push origin HEAD:refs/heads/stabilize/controller-sessions-and-macos
          fi
      - name: Capture tracked source for integration review
        if: always()
        shell: bash
        run: git archive --format=zip HEAD -o /tmp/stabilization-source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: stabilization-source
          path: /tmp/stabilization-source.zip
          retention-days: 3
