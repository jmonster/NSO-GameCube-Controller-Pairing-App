name: Build macOS (self-contained app)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'platform/macos/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'gc_controller_enabler.spec'
      - '.github/workflows/build-macos.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build-only native dependency
        run: brew install libusb
      - name: Test packaging diagnostics
        run: python -m unittest discover -s tests -p 'test_macos_bundle.py' -v
      - name: Build and verify relocated app
        env:
          PYTHON: python
        run: bash platform/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NSO-GameCube-Controller-Pairing-App-macOS-${{ matrix.arch }}
          path: dist/macos/NSO-GameCube-Controller-Pairing-App-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
