name: Verify focused BLE helper failure repair
on:
  push:
    branches: [work/validate-ble-helper-loss]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'jmonster/NSO-GameCube-Controller-Pairing-App'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply and validate the exact reviewed change without importing this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = Path('_review/ble.patch.b64').read_bytes()
          assert len(encoded) == 17036
          decoder = lzma.LZMADecompressor(memlimit=64 * 1024 * 1024)
          patch = decoder.decompress(base64.b64decode(encoded, validate=True), max_length=1024 * 1024)
          assert decoder.eof and not decoder.unused_data
          assert hashlib.sha256(patch).hexdigest() == '0380a1ed54768094a4ab8b67195a3c7521daf99dda535d9d97ddad32f0e63b80'
          Path('/tmp/ble-helper-loss.patch').write_bytes(patch)
          PY
          git checkout --detach d74eb1f9a6de64e4bda9d0418b23cc598989f31f
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am /tmp/ble-helper-loss.patch
          test "$(git rev-parse HEAD^{tree})" = fadeab9153f8c1aad94a4090b96b4a1c95503604
          python -m unittest discover -s tests -v
          python -m compileall -q src
          git diff --check d74eb1f9a6de64e4bda9d0418b23cc598989f31f
          test "$(git ls-remote origin refs/heads/fix/ble-helper-failure-cleanup | cut -f1)" = d74eb1f9a6de64e4bda9d0418b23cc598989f31f
          git push origin HEAD:refs/heads/fix/ble-helper-failure-cleanup
