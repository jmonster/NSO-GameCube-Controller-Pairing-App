name: Frozen application smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frozen-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.os }} / frozen Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            executable: dist/NSO-GameCube-Controller-Pairing-App.app/Contents/MacOS/NSO-GameCube-Controller-Pairing-App
          - os: windows-latest
            executable: dist/NSO-GameCube-Controller-Pairing-App.exe
    env:
      VGAMEPAD_SKIP_VIGEMBUS_INSTALL: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install macOS USB library
        if: runner.os == 'macOS'
        run: brew install libusb
      - name: Install authoritative dependency manifest
        run: python -m pip install -r requirements.txt
      - name: Record resolved environment
        run: |
          python -m pip freeze --all > resolved-dependencies.txt
          python -m pip check
      - name: Build actual distributed executable
        run: python -m PyInstaller --noconfirm --clean gc_controller_enabler.spec
      - name: Test frozen imports, assets, binary pipes and BLE child lifecycle
        run: python tools/check_frozen.py "${{ matrix.executable }}" frozen-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: frozen-diagnostics-${{ matrix.os }}
          path: |
            resolved-dependencies.txt
            frozen-smoke.json
            build/**/warn-*.txt
          retention-days: 7
