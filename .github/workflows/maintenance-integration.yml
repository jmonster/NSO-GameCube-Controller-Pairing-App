name: Temporary maintenance integration
on:
  push:
    branches: [stabilize/controller-sessions-and-macos]
    paths: ['.github/workflows/maintenance-integration.yml', '_stabilization/**']
permissions:
  contents: write
concurrency:
  group: maintenance-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Apply explicitly reviewed patches
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, re, subprocess
          for path in sorted(pathlib.Path('_stabilization').glob('*.json')):
              envelope = json.loads(path.read_text())
              parts = envelope.get('parts', [])
              assert len(parts) <= 16 and all(re.fullmatch(r'part-[0-9]+\.txt', p) for p in parts)
              chunks = [path.parent / p for p in parts]
              assert all(p.stat().st_size <= 128 * 1024 for p in chunks)
              payload = ''.join(p.read_text() for p in chunks) if chunks else envelope['payload']
              decoder = lzma.LZMADecompressor(memlimit=64 * 1024 * 1024)
              patch = decoder.decompress(base64.b64decode(payload, validate=True), max_length=5 * 1024 * 1024)
              assert decoder.eof and not decoder.unused_data
              assert hashlib.sha256(patch).hexdigest() == envelope['sha256']
              subprocess.run(['git', 'am', '--exclude=.github/workflows/*'], input=patch, check=True)
              subprocess.run(['git', 'rm', '--', str(path), *map(str, chunks)], check=True)
          PY
          python -m unittest discover -s tests -q
          python -m compileall -q src tools
          git diff --check "$GITHUB_SHA"
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            git commit -m 'chore: remove reviewed maintenance payloads'
            test "$(git ls-remote origin refs/heads/stabilize/controller-sessions-and-macos | cut -f1)" = "$GITHUB_SHA"
            git push origin HEAD:refs/heads/stabilize/controller-sessions-and-macos
          fi
      - name: Export exact source
        if: always()
        run: git bundle create /tmp/maintenance-source.bundle --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: maintenance-source
          path: /tmp/maintenance-source.bundle
          retention-days: 3
